<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hpm-fe · Admin de empresas</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --border: #e2e5ea; --text: #1c2128; --muted: #6b7280;
    --accent: #2563eb; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  header { background: #111827; color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header button { background: transparent; border: 1px solid #4b5563; color: #d1d5db; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 14px; font-size: 15px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; margin-top: 10px; }
  input[type=text], input[type=password], input[type=file] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: #fff; color: var(--text);
  }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  button.primary {
    margin-top: 14px; background: var(--accent); color: #fff; border: none; padding: 9px 16px;
    border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  button.link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 2px 4px; font-size: 13px; }
  button.link.danger { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; }
  .pill.ok { background: #dcfce7; color: #15803d; }
  .pill.off { background: #f3f4f6; color: #6b7280; }
  .pill.warn { background: #fef3c7; color: #92400e; }
  .pill.bad { background: #fee2e2; color: #b91c1c; }
  .msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; margin-top: 10px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: #dcfce7; color: #15803d; }
  .msg.err { background: #fee2e2; color: #b91c1c; }
  .subrow { display: none; background: #fafafa; }
  .subrow.show { display: table-row; }
  .subrow td { padding: 12px; }
  .muted { color: var(--muted); }
  #gate { max-width: 380px; margin: 80px auto; text-align: center; }
  #gate .card { text-align: left; }
  code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h2 id="gateTitulo">Redirigiendo…</h2>
    <p class="muted" id="gateTexto">Te llevamos a iniciar sesión con tu cuenta de hpm.ar.</p>
    <div class="msg err" id="gateMsg"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <h1>hpm-fe · Empresas emisoras</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="muted" id="whoami" style="color:#9ca3af;"></span>
      <button onclick="logout()">Salir</button>
    </div>
  </header>
  <main>

    <div class="card">
      <h2>Empresas</h2>
      <table id="tbl">
        <thead>
          <tr><th>CUIT</th><th>Razón social</th><th>Estado</th><th>Certificado</th><th>Última emisión</th><th></th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="muted" id="empty" style="display:none; padding:10px 0;">Todavía no hay empresas cargadas.</div>
    </div>

    <div class="card">
      <h2>Nueva empresa</h2>
      <form id="formNueva" onsubmit="crearEmpresa(event)">
        <div class="row">
          <div>
            <label>CUIT (11 dígitos, sin guiones)</label>
            <input type="text" id="n_cuit" pattern="[0-9]{11}" maxlength="11" required>
          </div>
          <div>
            <label>Razón social</label>
            <input type="text" id="n_razon" required>
          </div>
        </div>
        <div class="row">
          <div>
            <label>Contraseña del .p12</label>
            <input type="password" id="n_pass" required>
          </div>
          <div>
            <label>Archivo .p12</label>
            <input type="file" id="n_file" accept=".p12" required>
          </div>
        </div>
        <button class="primary" type="submit" id="n_submit">Dar de alta</button>
        <div class="msg" id="n_msg"></div>
      </form>
    </div>

  </main>
</div>

<script>
const API = '/api/v1/admin';
const TOKEN_KEY = 'hpmfe_admin_token';
const HPM_LOGIN_URL = 'https://hpm.ar/login.html';
const MI_URL = 'https://fe.hpm.ar/admin';

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function clearToken() { localStorage.removeItem(TOKEN_KEY); }

// El token llega por ?token=... tras pasar por hpm.ar/login.html (SSO de la plataforma).
// Se guarda y se limpia de la URL enseguida para que no quede en el historial.
function capturarTokenDeUrl() {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if (token) {
    setToken(token);
    history.replaceState({}, '', location.pathname);
  }
}

function irALogin() {
  location.href = HPM_LOGIN_URL + '?returnTo=' + encodeURIComponent(MI_URL);
}

async function api(path, opts = {}) {
  const headers = Object.assign({ Authorization: 'Bearer ' + getToken() }, opts.headers || {});
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  let body = null;
  try { body = await res.json(); } catch { /* respuesta vacia */ }
  if (res.status === 401) { clearToken(); showGate('redirigiendo'); throw new Error('401'); }
  if (res.status === 403) { showGate('sinrol'); throw new Error('403'); }
  if (!res.ok || (body && body.ok === false)) {
    throw new Error((body && (body.error || (body.detalles || []).join(', '))) || ('HTTP ' + res.status));
  }
  return body;
}

function showGate(motivo) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('gate').style.display = 'block';
  if (motivo === 'sinrol') {
    document.getElementById('gateTitulo').textContent = 'Sin permisos';
    document.getElementById('gateTexto').textContent = 'Tu usuario no tiene rol admin en tareas.hpm.ar. Pedile a un administrador que te lo asigne.';
  } else if (motivo === 'error') {
    document.getElementById('gateTitulo').textContent = 'No se pudo conectar';
    document.getElementById('gateTexto').textContent = 'Recargá la página para reintentar.';
  } else {
    document.getElementById('gateTitulo').textContent = 'Redirigiendo…';
    document.getElementById('gateTexto').textContent = 'Te llevamos a iniciar sesión con tu cuenta de hpm.ar.';
    setTimeout(irALogin, 400);
  }
}

function logout() {
  clearToken();
  irALogin();
}

function fmtFecha(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}

function pillCert(venc, err) {
  if (err) return '<span class="pill bad" title="' + esc(err) + '">sin leer</span>';
  if (!venc) return '<span class="pill off">—</span>';
  const dias = Math.floor((new Date(venc) - new Date()) / 86400000);
  const fecha = new Date(venc).toLocaleDateString('es-AR');
  if (dias < 0) return '<span class="pill bad">vencido ' + fecha + '</span>';
  if (dias <= 30) return '<span class="pill warn">vence ' + fecha + ' (' + dias + 'd)</span>';
  return '<span class="pill ok">vence ' + fecha + '</span>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function cargarEmpresas() {
  const data = await api('/empresas');
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  document.getElementById('empty').style.display = data.empresas.length ? 'none' : 'block';

  for (const e of data.empresas) {
    const tr = document.createElement('tr');
    const ult = e.ultima_emision
      ? fmtFecha(e.ultima_emision.created_at) + ' · CAE ' + esc(e.ultima_emision.cae || '—') + ' (' + esc(e.ultima_emision.resultado || '?') + ')'
      : '<span class="muted">sin emisiones</span>';
    tr.innerHTML = `
      <td>${esc(e.cuit)}${e.tiene_emisiones === false ? ` <button class="link" onclick="editarCuit(${e.id}, '${esc(e.cuit)}')">editar</button>` : ''}</td>
      <td>${esc(e.razon_social)} <button class="link" onclick="editarRazon(${e.id}, '${esc(e.razon_social).replace(/'/g, "\\'")}')">editar</button></td>
      <td><span class="pill ${e.activo ? 'ok' : 'off'}">${e.activo ? 'activa' : 'inactiva'}</span>
          <br><button class="link" onclick="toggleActivo(${e.id}, ${!e.activo})">${e.activo ? 'desactivar' : 'activar'}</button></td>
      <td>${pillCert(e.p12_vencimiento, e.p12_error)}<br><button class="link" onclick="toggleRotar(${e.id})">rotar certificado</button></td>
      <td>${ult}</td>
      <td></td>
    `;
    tbody.appendChild(tr);

    const sub = document.createElement('tr');
    sub.className = 'subrow';
    sub.id = 'rotar-' + e.id;
    sub.innerHTML = `
      <td colspan="6">
        <form onsubmit="rotarCertificado(event, ${e.id})">
          <strong>Rotar certificado de ${esc(e.cuit)}</strong>
          <div class="row">
            <div><label>Contraseña del nuevo .p12</label><input type="password" id="r_pass_${e.id}" required></div>
            <div><label>Archivo .p12</label><input type="file" id="r_file_${e.id}" accept=".p12" required></div>
          </div>
          <button class="primary" type="submit">Reemplazar</button>
          <button type="button" class="link" onclick="toggleRotar(${e.id})">cancelar</button>
          <div class="msg" id="r_msg_${e.id}"></div>
        </form>
      </td>
    `;
    tbody.appendChild(sub);
  }
}

function toggleRotar(id) {
  document.getElementById('rotar-' + id).classList.toggle('show');
}

async function toggleActivo(id, nuevoValor) {
  if (!confirm(nuevoValor ? '¿Activar esta empresa?' : '¿Desactivar esta empresa? HPM ya no va a poder emitir con este CUIT.')) return;
  try {
    await api('/empresas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ activo: nuevoValor }) });
    cargarEmpresas();
  } catch (err) { alert('Error: ' + err.message); }
}

async function editarCuit(id, actual) {
  const v = (prompt('Nuevo CUIT (11 dígitos, sin guiones):', actual) || '').trim();
  if (!v || v === actual) return;
  if (!/^\d{11}$/.test(v)) { alert('El CUIT debe tener 11 dígitos.'); return; }
  if (!confirm('¿Cambiar el CUIT ' + actual + ' por ' + v + '?\nHPM tiene que enviar el CUIT nuevo, y el certificado .p12 debe ser de ese CUIT.')) return;
  try {
    await api('/empresas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cuit: v }) });
    cargarEmpresas();
  } catch (err) { alert('Error: ' + err.message); }
}

async function editarRazon(id, actual) {
  const v = prompt('Nueva razón social:', actual);
  if (!v || v === actual) return;
  try {
    await api('/empresas/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ razon_social: v }) });
    cargarEmpresas();
  } catch (err) { alert('Error: ' + err.message); }
}

async function rotarCertificado(ev, id) {
  ev.preventDefault();
  const pass = document.getElementById('r_pass_' + id).value;
  const file = document.getElementById('r_file_' + id).files[0];
  const msgEl = document.getElementById('r_msg_' + id);
  msgEl.className = 'msg'; msgEl.textContent = '';
  if (!file) return;
  const fd = new FormData();
  fd.append('p12_password', pass);
  fd.append('p12', file);
  try {
    await api('/empresas/' + id + '/certificado', { method: 'PUT', body: fd });
    msgEl.className = 'msg ok show';
    msgEl.textContent = 'Certificado actualizado.';
    setTimeout(cargarEmpresas, 800);
  } catch (err) {
    msgEl.className = 'msg err show';
    msgEl.textContent = 'Error: ' + err.message;
  }
}

async function crearEmpresa(ev) {
  ev.preventDefault();
  const btn = document.getElementById('n_submit');
  const msgEl = document.getElementById('n_msg');
  msgEl.className = 'msg'; msgEl.textContent = '';
  const cuit = document.getElementById('n_cuit').value.trim();
  const razon = document.getElementById('n_razon').value.trim();
  const pass = document.getElementById('n_pass').value;
  const file = document.getElementById('n_file').files[0];
  if (!/^\d{11}$/.test(cuit)) { msgEl.className = 'msg err show'; msgEl.textContent = 'El CUIT debe tener 11 dígitos.'; return; }

  const fd = new FormData();
  fd.append('cuit', cuit);
  fd.append('razon_social', razon);
  fd.append('p12_password', pass);
  fd.append('p12', file);

  btn.disabled = true;
  try {
    await api('/empresas', { method: 'POST', body: fd });
    msgEl.className = 'msg ok show';
    msgEl.textContent = 'Empresa dada de alta.';
    document.getElementById('formNueva').reset();
    cargarEmpresas();
  } catch (err) {
    msgEl.className = 'msg err show';
    msgEl.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

// Sólo para mostrar el nombre en el header — no se usa para nada de seguridad,
// la app siempre confía en lo que responde /verify del lado del servidor.
function nombreDelToken(token) {
  try {
    const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return payload.nombre || payload.email || '';
  } catch { return ''; }
}

async function boot() {
  capturarTokenDeUrl();
  if (!getToken()) { showGate(); return; }
  try {
    await cargarEmpresas();
    document.getElementById('whoami').textContent = nombreDelToken(getToken());
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch (err) {
    if (err.message !== '401' && err.message !== '403') showGate('error');
  }
}

boot();
</script>
</body>
</html>
